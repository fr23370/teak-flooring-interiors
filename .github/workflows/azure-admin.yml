name: Deploy authenticated admin to Azure Static Web Apps

# Manual until the Azure Static Web App and its deployment secret are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy authenticated admin
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
